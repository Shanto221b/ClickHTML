<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
</head>

<body>

<h2>Change Password</h2>

<form action="view_profile.html" method="GET">

    <table>

        <tr>
            <th>
                <label for="old_password">Old Password:</label>
            </th>
            <td>
                <input type="password"
                       id="old_password"
                       name="old_password"
                       value="123456">
            </td>
        </tr>

        <tr>
            <th>
                <label for="new_password">New Password:</label>
            </th>
            <td>
                <input type="password"
                       id="new_password"
                       name="new_password"
                       value="654321">
            </td>
        </tr>

        <tr>
            <td colspan="2" align="center">
                <input type="submit" value="Change Password">
            </td>
        </tr>

    </table>

</form>

<br><br>

<a class="back-btn" href="view_profile.html">Back To Profile</a>

</body>
</html>
